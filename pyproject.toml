[project]
dynamic = ["version"]
name = "svoa-ha-integration"
description = "An integration for Stockholm Vatten och Avfall for including dates from Returrundan into HA"
authors = [
  {name = "aiquen", email = "aiqueneldar@gmail.com"}
]
maintainers = [
  {name = "aiquen", email = "aiqueneldar@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.14.2"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-homeassistant-custom-component",
  "aioresponses"
]
lint = [
  "ruff",
  "mypy"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001"]
